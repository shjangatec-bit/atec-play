name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atec-play/atec-play
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: atec-play/atec-play/package-lock.json
      - run: npm ci
      # 지원금 계산 등 핵심 로직 단위 테스트
      - run: npm test
      # 빌드가 깨지지 않는지 확인 (실제 키가 아닌 더미 값 사용)
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
